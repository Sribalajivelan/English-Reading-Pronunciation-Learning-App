<title>Angilam Padippom</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Thambi+2:wght@500;700;800&family=Lexend:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;700&display=swap">
<style>
/* Layout: one column "workbook" (max 940px); bottom tab bar; Tamil is the voice, English is the thing being learned. */
:root{
  --bg:#F3F7F5; --surface:#FFFFFF; --soft:#E7F0EC; --ink:#12302B; --muted:#58706A; --line:#D3E0DA;
  --accent:#0E6B5B; --on-accent:#FFFFFF; --mark:#F0A30A; --mark-soft:#FCEFCB; --mark-ink:#6B4500;
  --good:#1E8A4C; --bad:#C23B2E; --bad-soft:#F9E1DD; --good-soft:#DDF1E4;
  --f-head:'Baloo Thambi 2','Noto Sans Tamil',sans-serif;
  --f-body:'Lexend','Noto Sans Tamil',system-ui,sans-serif;
  --f-ta:'Noto Sans Tamil','Lexend',sans-serif;
  --shadow:0 1px 0 rgba(18,48,43,.06),0 8px 24px -12px rgba(18,48,43,.18);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0C1A17; --surface:#132622; --soft:#1B342E; --ink:#E5F1EC; --muted:#94ADA5; --line:#27443C;
  --accent:#4FC3A8; --on-accent:#06231D; --mark:#F5B83A; --mark-soft:#3A2E10; --mark-ink:#F6D58A;
  --good:#5BD08A; --bad:#FF8A7C; --bad-soft:#40201C; --good-soft:#163A26; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A17; --surface:#132622; --soft:#1B342E; --ink:#E5F1EC; --muted:#94ADA5; --line:#27443C;
  --accent:#4FC3A8; --on-accent:#06231D; --mark:#F5B83A; --mark-soft:#3A2E10; --mark-ink:#F6D58A;
  --good:#5BD08A; --bad:#FF8A7C; --bad-soft:#40201C; --good-soft:#163A26; --shadow:none; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;margin:0}
.wrap{max-width:940px;margin-inline:auto}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px;border-radius:6px}
h1,h2,h3{font-family:var(--f-head);line-height:1.2;margin:0;text-wrap:balance}
h2{font-size:1.5rem;font-weight:700}
h3{font-size:1.15rem;font-weight:700}
p{margin:0}
.ta{font-family:var(--f-ta)}
.muted{color:var(--muted)}
.eyebrow{font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:500}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:16px 8px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column}
.brand b{font-family:var(--f-head);font-size:1.45rem;font-weight:800;line-height:1.1}
.brand span{font-size:.78rem;color:var(--muted)}
.slow{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-size:.85rem;font-family:var(--f-ta)}
.slow i{width:34px;height:20px;border-radius:99px;background:var(--line);position:relative;transition:background .2s}
.slow i::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:0 0 0 1px var(--muted);transition:transform .2s}
.slow[aria-pressed="true"] i{background:var(--accent)}
.slow[aria-pressed="true"] i::after{transform:translateX(14px)}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav .in{max-width:940px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
nav a{display:flex;flex-direction:column;align-items:center;gap:0;padding:6px 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-family:var(--f-ta);font-size:.82rem;font-weight:500;line-height:1.25}
nav a small{font-family:var(--f-body);font-size:.66rem;letter-spacing:.04em;opacity:.85}
nav a[aria-current="page"]{background:var(--soft);color:var(--accent)}
nav a[aria-current="page"]{font-weight:700}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.plain{background:var(--soft);border-radius:16px;padding:16px}
.btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:12px;padding:11px 18px;font-weight:600;font-family:var(--f-ta);display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-size:.95rem}
.btn svg{width:18px;height:18px;flex:none}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.mark{background:var(--mark);color:#3a2600}
.btn[disabled]{opacity:.45;cursor:default}
.spk{width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--accent);display:inline-grid;place-items:center;flex:none}
.spk svg{width:18px;height:18px}

/* hero apple */
.hero{padding:24px 20px 22px;background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.6rem,5.5vw,2.4rem);font-weight:800}
.hero .lead{margin-top:6px;color:var(--muted);font-family:var(--f-ta)}
.tiles{display:flex;gap:8px;margin:20px 0 14px;flex-wrap:nowrap}
.tile{flex:1 1 0;min-width:0;max-width:96px;text-align:center;padding:12px 2px 10px;border-radius:14px;background:var(--soft);border:2px solid transparent;transition:background .25s,border-color .25s,transform .25s}
.tile b{display:block;font-size:clamp(1.6rem,8vw,2.4rem);font-weight:600;line-height:1.1}
.tile span{display:block;font-family:var(--f-ta);font-weight:700;font-size:clamp(1rem,4.6vw,1.45rem);color:var(--accent);margin-top:4px}
.tile.silent{background:transparent;border:2px dashed var(--muted)}
.tile.silent b{color:var(--muted)}
.tile.silent span{color:var(--muted);font-size:clamp(.62rem,2.6vw,.8rem);font-weight:500;margin-top:10px}
.hero.play .tile{background:var(--mark-soft);border-color:var(--mark);transform:translateY(-4px)}
.hero.play .tile.silent{background:transparent;border-color:var(--muted);transform:none}
.hero.play .tile:nth-child(2){transition-delay:.35s}.hero.play .tile:nth-child(3){transition-delay:.7s}
.hero.play .tile:nth-child(4){transition-delay:1.05s}
.result{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.result .big{font-family:var(--f-head);font-size:2.2rem;font-weight:800;color:var(--accent);line-height:1}
.result .eq{color:var(--muted)}
.notes{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:6px;font-family:var(--f-ta);font-size:.95rem}
.notes li{display:flex;gap:10px}
.notes li::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--mark);margin-top:.6em}

/* progress */
.prog{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.ring{width:112px;height:112px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .c b{font-family:var(--f-head);font-size:1.9rem;font-weight:800;line-height:1}
.ring .c span{font-size:.7rem;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat b{display:block;font-family:var(--f-head);font-size:1.5rem;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);font-family:var(--f-ta)}
.next{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.next .dn{font-family:var(--f-head);font-weight:800;color:var(--mark-ink);background:var(--mark-soft);border-radius:10px;padding:2px 10px;font-size:.9rem;display:inline-block}
.routine{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.routine div{background:var(--soft);border-radius:14px;padding:14px}
.routine b{font-family:var(--f-head);font-size:1.5rem;color:var(--accent);display:block;line-height:1}
.routine span{font-family:var(--f-ta);font-size:.92rem}
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:minmax(0,9.5rem) 1fr auto;gap:12px;align-items:center;font-size:.85rem}
.bar .tr{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar em{font-style:normal;font-variant-numeric:tabular-nums;color:var(--muted)}
details.tip{border-top:1px solid var(--line);padding:12px 0}
details.tip summary{cursor:pointer;font-family:var(--f-ta);font-weight:700}
details.tip p,details.tip ul{margin-top:8px;font-family:var(--f-ta);font-size:.95rem;color:var(--muted)}
details.tip ul{padding-left:20px}

/* plan */
.week{display:flex;flex-direction:column;gap:12px}
.week header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.day{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-decoration:none;color:inherit;min-width:0}
.day .n{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--soft);font-family:var(--f-head);font-weight:800;font-size:1.05rem;font-variant-numeric:tabular-nums}
.day.done .n{background:var(--accent);color:var(--on-accent)}
.day.cur{border-color:var(--mark);box-shadow:0 0 0 2px var(--mark-soft)}
.day div{min-width:0}
.day b{display:block;font-weight:500;font-size:.9rem;line-height:1.3}
.day span{font-family:var(--f-ta);font-size:.85rem;color:var(--muted);display:block;line-height:1.35}
.day .ck{width:22px;height:22px;color:var(--good)}

/* day view */
.crumb{display:inline-flex;gap:6px;align-items:center;color:var(--accent);text-decoration:none;font-family:var(--f-ta);font-weight:500;padding-block:8px}
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead .pill{align-self:flex-start;background:var(--mark-soft);color:var(--mark-ink);font-weight:600;font-size:.8rem;border-radius:99px;padding:3px 12px}
.dhead h2{font-size:clamp(1.5rem,5vw,2rem)}
.dhead .tt{font-family:var(--f-head);font-size:1.15rem;color:var(--accent);font-weight:700}
.tasks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.tasks button{width:100%;display:grid;grid-template-columns:auto 1fr;gap:12px;text-align:left;background:var(--soft);border:0;border-radius:12px;padding:12px;align-items:start}
.tasks .bx{width:24px;height:24px;border-radius:8px;border:2px solid var(--muted);display:grid;place-items:center;margin-top:1px}
.tasks .bx svg{width:16px;height:16px;opacity:0}
.tasks .on .bx{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tasks .on .bx svg{opacity:1}
.tasks .on .te{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
.tasks .te{display:block;font-size:.95rem;line-height:1.4}
.tasks .tt2{display:block;font-family:var(--f-ta);font-size:.88rem;color:var(--muted);margin-top:2px}
.sec{display:flex;flex-direction:column;gap:12px}
.sec>h3{display:flex;align-items:center;gap:10px}
.sec>h3 small{font-family:var(--f-ta);font-size:.8rem;font-weight:400;color:var(--muted)}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.w{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;position:relative}
.w{cursor:pointer}
.w:active{background:var(--soft)}
.w .wt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;width:100%}
.w .en{font-size:1.25rem;font-weight:500;overflow-wrap:anywhere;line-height:1.25}
.w .tam{font-family:var(--f-ta);font-weight:700;color:var(--accent);font-size:1.02rem}
.w .hint{font-size:.75rem;color:var(--muted);overflow-wrap:anywhere}
.w .dots{display:flex;gap:4px;margin-top:6px}
.w .dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.w .dots i.f{background:var(--mark)}
.repnote{font-family:var(--f-ta);font-size:.85rem;color:var(--muted)}
.pats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.pat{background:var(--mark-soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;min-width:0}
.pat .p{font-family:var(--f-head);font-weight:800;font-size:1.5rem;color:var(--mark-ink);line-height:1.1}
.pat .pt{font-family:var(--f-ta);font-size:.9rem;font-weight:500;color:var(--ink)}
.pat .px{font-size:.85rem;color:var(--muted)}
.pat .px b{font-weight:500;color:var(--ink)}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px}
.pair button{background:var(--soft);border:0;border-radius:10px;padding:8px;text-align:center;line-height:1.3;min-width:0}
.pair button b{display:block;font-weight:500;overflow-wrap:anywhere}
.pair button span{font-family:var(--f-ta);font-size:.82rem;color:var(--accent);font-weight:700}
.pair .ar{color:var(--muted)}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.lc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lc .h{display:flex;gap:12px;align-items:center}
.lc .lb{border:0;background:var(--soft);border-radius:12px;width:72px;height:64px;font-family:var(--f-head);font-weight:800;font-size:2rem;color:var(--accent);flex:none}
.lc .lb small{font-size:1.25rem;font-weight:600}
.lc .snd{font-family:var(--f-ta);font-weight:700;font-size:1.15rem;line-height:1.25}
.lc .snd small{display:block;font-weight:400;font-size:.72rem;color:var(--muted)}
.snds{display:flex;gap:8px;flex-wrap:wrap}
.snds button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--on-accent);border-radius:10px;padding:6px 12px 6px 9px;line-height:1.2}
.snds button svg{width:16px;height:16px;flex:none}
.snds button span{font-weight:700;font-size:1.05rem}
.snds button small{font-size:.7rem;opacity:.85}
.ex{display:flex;gap:8px;flex-wrap:wrap}
.ex button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:5px 10px;line-height:1.25;text-align:left}
.ex button b{font-weight:500;margin-right:6px}
.ex button span{font-family:var(--f-ta);color:var(--accent);font-weight:700;font-size:.85rem}
.cv{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.cv button{border:0;background:var(--mark-soft);color:var(--mark-ink);border-radius:9px;padding:5px 0 4px;line-height:1.2;min-width:0}
.cv button b{display:block;font-size:.85rem;font-weight:500}
.cv button span{display:block;font-family:var(--f-ta);font-size:.95rem;font-weight:700}
.lc .tipx{font-family:var(--f-ta);font-size:.82rem;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}

/* reader */
.pass{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.pass .ph{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.line{display:flex;gap:10px;align-items:flex-start}
.line .tx{flex:1;min-width:0}
.line .en{font-size:1.2rem;line-height:1.75}
.line .en button{border:0;background:transparent;padding:0 1px;border-radius:5px;font-size:inherit;font-weight:500;font-family:inherit}
.line .en button:hover{background:var(--mark-soft)}
.line .en .pu{color:var(--bad);font-weight:700;margin-right:3px}
.line .rd{font-family:var(--f-ta);color:var(--accent);font-weight:500;font-size:.95rem}
.line .mn{font-family:var(--f-ta);color:var(--muted);font-size:.88rem}
.qa{background:var(--soft);border-radius:12px;padding:12px;font-family:var(--f-ta);font-size:.92rem;display:grid;gap:6px}
.qa .ans{color:var(--good);font-weight:700}
.qa button{justify-self:start}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rate button{border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 6px;font-family:var(--f-ta);font-size:.88rem;line-height:1.3}
.rate button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);font-weight:700;color:var(--accent)}
.dnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:16px}
.counter b{font-family:var(--f-head);font-size:2.2rem;font-variant-numeric:tabular-nums;min-width:3ch;text-align:center}
.counter button{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-size:1.5rem;line-height:1}
.timer{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.timer b{font-family:var(--f-head);font-size:2.2rem;font-variant-numeric:tabular-nums}

/* practice */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.mode{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.mode:hover{border-color:var(--accent)}
.mode h3{color:var(--accent)}
.mode .ta,.mode p{font-family:var(--f-ta);font-size:.9rem;color:var(--muted)}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:8px 14px;font-family:var(--f-ta);font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.qtop{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qprompt{display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:8px;text-align:center}
.qprompt .bigspk{width:84px;height:84px;border-radius:50%;border:0;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.qprompt .bigspk svg{width:38px;height:38px}
.qprompt .qw{font-size:clamp(2rem,9vw,3rem);font-weight:500;line-height:1.1;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:1.15rem;font-family:var(--f-body);min-height:56px}
.opt.ta{font-family:var(--f-ta);font-weight:700}
.opt.ok{background:var(--good-soft);border-color:var(--good)}
.opt.no{background:var(--bad-soft);border-color:var(--bad)}
.fb{font-family:var(--f-ta);font-weight:700;text-align:center;min-height:1.6em}
.score{font-family:var(--f-head);font-size:3.4rem;font-weight:800;color:var(--accent);line-height:1}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-family:var(--f-ta);font-size:.9rem;z-index:30;max-width:calc(100% - 32px)}
.celebrate{background:linear-gradient(135deg,var(--mark-soft),var(--soft));border-radius:18px;padding:20px;text-align:center}
.celebrate h3{font-size:1.5rem}
@media (max-width:520px){

<script>
/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let S={};try{S=JSON.parse(localStorage.getItem('ap-v1')||'{}')||{}}catch(e){S={}}
['done','tasks','rating','best','counter','speed'].forEach(k=>S[k]=S[k]||{});
const save=()=>{try{localStorage.setItem('ap-v1',JSON.stringify(S))}catch(e){}};
const ICON={
 spk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
 chk:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
 back:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>'
};
const spkBtn=(t,label)=>`<button class="spk" type="button" data-say="${esc(t)}" aria-label="${esc(label||'Listen')}">${ICON.spk}</button>`;

/* speech */
let voices=[];const hasTTS='speechSynthesis' in window;
if(hasTTS){const lv=()=>{voices=speechSynthesis.getVoices()};lv();speechSynthesis.onvoiceschanged=lv}
function say(t){
  if(!hasTTS){toast('இந்த உலாவியில் ஒலி வசதி இல்லை');return}
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);
    const v=voices.find(v=>v.lang==='en-IN')||voices.find(v=>v.lang==='en-US')||voices.find(v=>/^en/i.test(v.lang));
    if(v){u.voice=v;u.lang=v.lang}else u.lang='en-US';
    u.rate=S.slow?0.55:0.9;speechSynthesis.speak(u)}catch(e){toast('ஒலி இயக்க முடியவில்லை')}
}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200)}

/* ---------- letter data ---------- */
const LN={A:'ay',B:'bee',C:'see',D:'dee',E:'ee',F:'eff',G:'jee',H:'aitch',I:'eye',J:'jay',K:'kay',L:'el',M:'em',N:'en',O:'oh',P:'pee',Q:'cue',R:'ar',S:'ess',T:'tee',U:'you',V:'vee',W:'double you',X:'ex',Y:'why',Z:'zed'};
const LET='A|அ / ஆ / ஏ|cat|கேட்|cake|கேக்;E|எ / ஈ|pen|பென்|me|மீ;I|இ / ஐ|sit|சிட்|ice|ஐஸ்;O|ஒ / ஓ|hot|ஹாட்|go|கோ;U|உ / யூ|cup|கப்|cute|க்யூட்;'+
'B|ப்|book|புக்;C|க் / ஸ்|cat|கேட்|city|சிட்டி;D|ட்|dog|டாக்;F|ஃப்|fish|பிஷ்;G|க்|go|கோ;H|ஹ்|hat|ஹேட்;J|ஜ்|job|ஜாப்;K|க்|king|கிங்;L|ல்|love|லவ்;M|ம்|man|மேன்;N|ன்|name|நேம்;P|ப்|pen|பென்;Q|க்வ்|queen|க்வீன்;R|ர்|red|ரெட்;S|ஸ்|sun|சன்;T|ட்|top|டாப்;V|வ்|voice|வாய்ஸ்;W|வ்|water|வாட்டர்;X|க்ஸ்|box|பாக்ஸ்;Y|ய்|yes|யெஸ்;Z|ஸ் (ஜ்-ஸ் அதிர்வு)|zero|ஸீரோ';
const LTIP={C:'a, o, u முன் "க்"; e, i, y முன் "ஸ்" (city).',F:'மேல் பற்கள் கீழ் உதட்டைத் தொட்டு ஊதவும் (ஃ). திட்டத்தில் "ப்" என்று இருந்தாலும் இதுவே சரியான ஒலி.',V:'மேல் பற்கள் கீழ் உதட்டைத் தொடும். W-ல் உதடுகள் உருண்டிருக்கும்.',W:'உதடுகளை உருட்டி "வு" போல தொடங்கவும்.',Q:'எப்போதும் U உடன் வரும்: qu = க்வ்.',R:'நாக்கு மேலண்ணத்தைத் தொடாது. தமிழ் "ர்" போல உருட்ட வேண்டாம்.',Z:'S போல, ஆனால் தொண்டையில் அதிர்வு இருக்கும்.',D:'T-ஐ விட மென்மையாக.',T:'D-ஐ விட அழுத்தமாக.',H:'மூச்சை வெளியே விடுங்கள்.',J:'"ஜ" போல.',X:'பெரும்பாலும் சொல்லின் முடிவில் "க்ஸ்".',G:'gem, giant-ல் "ஜ்" ஆகவும் வரும்.'};
const TB={B:['ப',''],C:['க',''],D:['ட',''],F:['ஃப',''],G:['க',''],H:['ஹ',''],J:['ஜ',''],K:['க',''],L:['ல',''],M:['ம',''],N:['ன',''],P:['ப',''],Q:['வ','க்'],R:['ர',''],S:['ஸ',''],T:['ட',''],V:['வ',''],W:['வ',''],X:['ஸ','க்'],Y:['ய',''],Z:['ஸ','']};
const SP={B:'b',C:'k',D:'d',F:'f',G:'g',H:'h',J:'j',K:'k',L:'l',M:'m',N:'n',P:'p',Q:'kw',R:'r',S:'s',T:'t',V:'v',W:'w',X:'ks',Y:'y',Z:'z'};
const VS=[['a','','ah'],['e','ெ','eh'],['i','ி','ih'],['o','ொ','oh'],['u','ு','uh']];
/* sound buttons: [label, Tamil, spoken respelling] (respellings approximate what a speech voice can say) */
const VSND={A:[['short','அ','ah'],['long','ஏ','ay']],E:[['short','எ','eh'],['long','ஈ','ee']],I:[['short','இ','ih'],['long','ஐ','eye']],O:[['short','ஒ','aw'],['long','ஓ','oh']],U:[['short','உ','uh'],['long','யூ','you']]};
const CSND={B:['buh'],C:['kuh','sss'],D:['duh'],F:['fff'],G:['guh'],H:['huh'],J:['juh'],K:['kuh'],L:['lll'],M:['mmm'],N:['nnn'],P:['puh'],Q:['kwuh'],R:['rrr'],S:['sss'],T:['tuh'],V:['vvv'],W:['wuh'],X:['ks'],Y:['yuh'],Z:['zzz']};
const LETTERS=LET.split(';').map(s=>{const p=s.split('|');return{l:p[0],ta:p[1],ex:[[p[2],p[3]],p[4]?[p[4],p[5]]:null].filter(Boolean),vowel:'AEIOU'.includes(p[0])}});
const LMAP=Object.fromEntries(LETTERS.map(x=>[x.l,x]));
function letterCard(L){
  const x=LMAP[L];
  const snd=x.vowel?VSND[L].map(s=>[s[0],s[1],s[2]]):CSND[L].map((s,i)=>[CSND[L].length>1?(i?'soft':'hard'):'sound',x.ta.split(' / ')[i].replace(/\s*\(.*\)/,''),s]);
  const sb=`<div class="snds" aria-label="${L} sounds">${snd.map(s=>`<button type="button" data-say="${s[2]}">${ICON.spk}<span class="ta">${s[1]}</span><small>${s[0]}</small></button>`).join('')}</div>`;
  const cv=x.vowel?'':`<div class="cv" aria-label="${L} + vowels">${VS.map(v=>{const b=TB[L];return `<button type="button" data-say="${SP[L]+v[2]}"><b>${L.toLowerCase()}${v[0]}</b><span>${b[1]+b[0]+v[1]}</span></button>`}).join('')}</div>`;
  return `<article class="lc"><div class="h"><button class="lb" type="button" data-say="${LN[L]}" aria-label="Letter ${L}">${L}<small>${L.toLowerCase()}</small></button>
  <div class="snd">${esc(x.ta)}<small>ஒலி · ${x.vowel?'vowel':'consonant'}</small></div></div>
  ${sb}<div class="ex">${x.ex.map(e=>`<button type="button" data-say="${e[0]}"><b>${e[0]}</b><span>${e[1]}</span></button>`).join('')}</div>${cv}
  ${LTIP[L]?`<div class="tipx">${LTIP[L]}</div>`:''}</article>`;
}

/* ---------- day data ---------- */

const P=s=>s.split(';').map(x=>{const p=x.split('|');return{p:p[0],ta:p[1],ex:p[2],exta:p[3]||''}});
const PAIR=s=>s.split(';').map(x=>x.split('|'));
const DAYS={};

 ['Practice simple words: cat, pen, sit, hot, cup','எளிய வார்த்தைகளைப் பயிலவும்: cat, pen, sit, hot, cup'],

 ['Learn: B, C, D, F, G, H','கற்கவும்: B, C, D, F, G, H'],

D(3,'Common Consonants (Part 2)','பொதுவான மெய்யெழுத்துகள் (பகுதி 2)',[

 ['Practice words: queen, red, sun, top, voice, water, box, yes, zero','வார்த்தைகளைப் பயிலவும்'],
 ['Say the whole alphabet, A to Z','A முதல் Z வரை முழு அகரவரிசையைச் சொல்லவும்'],
 ['Test yourself on all 26 letters (see Practice tab)','26 எழுத்துகளிலும் உங்களைச் சோதிக்கவும் (பயிற்சி பக்கம்)']],
 {letters:'QRSTVWXYZ',words:W('queen|க்வீன்;red|ரெட்;sun|சன்;top|டாப்;voice|வாய்ஸ்;water|வாட்டர்;box|பாக்ஸ்;yes|யெஸ்;zero|ஸீரோ')});
D(5,'Simple 3-Letter Words','எளிய 3 எழுத்து வார்த்தைகள்',[
 ['Read 20 three-letter words','20 மூன்றெழுத்து வார்த்தைகளைப் படிக்கவும்'],
 ['Blend the sounds together: c-a-t → cat','ஒலிகளை இணைக்கவும்: c-a-t → கேட்'],
 ['Write each word and say it aloud','ஒவ்வொரு வார்த்தையையும் எழுதி சத்தமாகச் சொல்லவும்']],
 {words:W('cat|கேட்;dog|டாக்;pen|பென்;sun|சன்;box|பாக்ஸ்;man|மேன்;run|ரன்;sit|சிட்;hot|ஹாட்;cup|கப்;bat|பேட்;bed|பெட்;big|பிக்;hat|ஹேட்;jam|ஜேம்;leg|லெக்;map|மேப்;net|நெட்;pig|பிக்;bus|பஸ்')});
D(6,'4-Letter Words','4 எழுத்து வார்த்தைகள்',[

 ['Write each word and say it aloud','எழுதி சத்தமாகச் சொல்லவும்']],

D(7,'Review & Assessment','மறுபார்வை & மதிப்பீடு',[

/* ---------- derived ---------- */
const TOTAL=30;
const wordsOf=n=>{const d=DAYS[n];return d.words||[]};
function dayWords(d,seed){
  if(!d.review)return d.words||[];
  const seen=new Set(),out=[];
  d.review.forEach(k=>(DAYS[k].words||[]).forEach(w=>{const key=w.en.toLowerCase();if(!seen.has(key)){seen.add(key);out.push(w)}}));
  const a=seed?out.slice().sort(()=>Math.random()-.5):out;
  return d.limit?a.slice(0,d.limit):a;
}
const doneCount=()=>Object.keys(S.done).length;
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const dayNum=s=>Math.round(new Date(s+'T00:00:00').getTime()/864e5);
function streak(){
  const set=new Set(Object.values(S.done).map(dayNum));let t=dayNum(todayStr()),c=0;
  if(!set.has(t))t--;
  while(set.has(t)){c++;t--}return c;
}
const nextDay=()=>{for(let i=1;i<=TOTAL;i++)if(!S.done[i])return i;return null};
const taskProg=n=>{const d=DAYS[n];return d.tasks.filter((_,i)=>S.tasks[n+'-'+i]).length/d.tasks.length};

/* ---------- views ---------- */
function reader(p,pi,open){
  const lines=p.lines.map(l=>l.split('|'));
  const rows=lines.map(([en,rd,mn],i)=>{
    const toks=en.match(/[A-Za-z’']+|[^A-Za-z’'\s]+/g)||[];
    const html=toks.map(t=>/[A-Za-z]/.test(t)?`<button type="button" data-say="${esc(t)}">${esc(t)}</button>`:`<span class="pu">${esc(t)}</span>`).join(' ').replace(/ (<span class="pu">)/g,'$1');
    return `<div class="line">${spkBtn(en,'Read sentence')}<div class="tx"><div class="en">${html}</div>${rd?`<div class="rd">${esc(rd)}</div>`:''}${mn?`<div class="mn">${esc(mn)}</div>`:''}</div></div>`;
  }).join('');
  const full=lines.map(l=>l[0]).join(' ');
  return `<section class="pass"><div class="ph"><div><h3>${esc(p.t)}</h3><span class="ta muted" style="font-size:.85rem">${esc(p.ta)}</span></div>
   <button class="btn ghost" type="button" data-say="${esc(full)}">${ICON.spk} முழுதும் கேள்</button></div>${rows}
   ${p.sum?`<details class="qa"><summary>தமிழ் பொருள்</summary><p>${esc(p.sum)}</p></details>`:''}
   ${p.q?`<div class="qa"><div><b>Q:</b> ${esc(p.q[0])} <span class="muted">(${esc(p.q[1])})</span></div><button class="btn ghost" type="button" data-act="reveal">பதிலைக் காட்டு</button><div class="ans" hidden>${esc(p.q[2])} · ${esc(p.q[3])}</div></div>`:''}</section>`;

let Q=null,qopt={mode:'listen',pool:'learned'};
function poolWords(){
  let max=qopt.pool==='all'?TOTAL:Math.max(6,(Math.max(0,...Object.keys(S.done).map(Number))||0)+1);
  const seen=new Set(),out=[];
  for(let i=1;i<=Math.min(max,TOTAL);i++){(DAYS[i].words||[]).forEach(w=>{const k=w.en.toLowerCase();if(!seen.has(k)){seen.add(k);out.push(w)}})}
  return out;
}
const shuf=a=>a.slice().sort(()=>Math.random()-.5);
function startQuiz(mode){
  const pool=poolWords();const items=shuf(pool).slice(0,10).map(w=>{
    const others=shuf(pool.filter(x=>x.en.toLowerCase()!==w.en.toLowerCase()&&(mode==='listen'||x.ta!==w.ta)));
    const opts=shuf([w,...others.slice(0,3)]);return{w,opts,ans:opts.indexOf(w)}});
  Q={mode,items,i:0,score:0,picked:null};
}

    return `<div><h2 class="ta">பயிற்சித் தேர்வு</h2><p class="muted ta">10 கேள்விகள். ஒவ்வொரு முறையும் வேறு வார்த்தைகள் வரும்.</p></div>
    <div class="row"><span class="ta muted" style="font-size:.9rem">வார்த்தைகள்:</span><div class="seg" role="group"><button type="button" data-act="pool" data-v="learned" aria-pressed="${qopt.pool==='learned'}">இதுவரை கற்றவை</button><button type="button" data-act="pool" data-v="all" aria-pressed="${qopt.pool==='all'}">எல்லாம்</button></div><span class="muted" style="font-size:.8rem">${pw} words</span></div>
    <div class="modes"><button class="mode" type="button" data-act="quiz" data-v="listen"><h3 class="ta">கேட்டுத் தேர்ந்தெடு</h3><p>ஒலியைக் கேட்டு, சரியான ஆங்கிலச் சொல்லைத் தேர்ந்தெடுங்கள்.</p><span class="muted" style="font-size:.8rem">Listen → pick the word · Best ${S.best.listen||0}/10</span></button>
    <button class="mode" type="button" data-act="quiz" data-v="read"><h3 class="ta">படித்து ஒலியைத் தேர்ந்தெடு</h3><p>ஆங்கிலச் சொல்லைப் பார்த்து, சரியான தமிழ் ஒலியைத் தேர்ந்தெடுங்கள்.</p><span class="muted" style="font-size:.8rem">Read → pick the sound · Best ${S.best.read||0}/10</span></button></div>`;
  }
  if(Q.i>=Q.items.length){
    const b=S.best[Q.mode]||0;const msg=Q.score>=9?'அருமை!':Q.score>=6?'நன்று! தொடருங்கள்.':'மீண்டும் பயிற்சி செய்யுங்கள்.';
    return `<div class="card stack" style="text-align:center;align-items:center"><span class="eyebrow">முடிவு</span><div class="score">${Q.score}/10</div><p class="ta" style="font-weight:700">${msg}</p><p class="muted ta">சிறந்த மதிப்பெண்: ${b}/10</p>
     <div class="row"><button class="btn" type="button" data-act="quiz" data-v="${Q.mode}">மீண்டும்</button><button class="btn ghost" type="button" data-act="qexit">முடி</button></div></div>`;
  }
  const it=Q.items[Q.i],listen=Q.mode==='listen';
  const opts=it.opts.map((o,k)=>{let c='';if(Q.picked!==null){if(k===it.ans)c='ok';else if(k===Q.picked)c='no'}
    return `<button class="opt ${listen?'':'ta'} ${c}" type="button" data-act="pick" data-v="${k}" ${Q.picked!==null?'disabled':''}>${esc(listen?o.en:o.ta)}</button>`}).join('');
  return `<div class="card stack"><div class="qtop"><span>கேள்வி ${Q.i+1} / 10</span><span>மதிப்பெண் ${Q.score}</span></div><div class="qbar"><i style="width:${Q.i/10*100}%"></i></div>
   <div class="qprompt">${listen?`<button class="bigspk" type="button" data-say="${esc(it.w.en)}" aria-label="Play word">${ICON.spk}</button><span class="ta muted">கேட்டு, சரியான சொல்லைத் தேர்ந்தெடுங்கள்</span>`
    :`<div class="qw">${esc(it.w.en)}</div>${spkBtn(it.w.en,'Play word')}<span class="ta muted">இதன் சரியான ஒலி எது?</span>`}</div>
   <div class="opts">${opts}</div>
   <div class="fb" id="fb">${Q.picked===null?'':Q.picked===it.ans?'<span style="color:var(--good)">சரி!</span>':`<span style="color:var(--bad)">தவறு. சரியானது: ${esc(listen?it.w.en+' ('+it.w.ta+')':it.w.ta)}</span>`}</div>
   ${Q.picked!==null?`<div class="row" style="justify-content:center"><button class="btn" type="button" data-act="qnext">${Q.i===9?'முடிவைப் பார்':'அடுத்தது'}</button></div>`:''}
   <div class="row" style="justify-content:center"><button class="btn ghost" type="button" data-act="qexit" style="padding:6px 14px;font-size:.82rem">வெளியேறு</button></div></div>`;
}

/* ---------- router ---------- */
const NAV=[['home','முகப்பு','Home'],['plan','திட்டம்','Plan'],['letters','எழுத்துகள்','Letters'],['practice','பயிற்சி','Quiz'],['read','வாசிப்பு','Read']];
function route(){const h=(location.hash||'#home').slice(1);const m=h.match(/^day-(\d+)$/);return m?{v:'day',n:+m[1]}:{v:NAV.some(x=>x[0]===h)?h:'home'}}
function render(){
  clearInterval(timer);timer=null;
  const r=route();const app=document.getElementById('app');
  app.innerHTML=r.v==='home'?vHome():r.v==='plan'?vPlan():r.v==='day'?vDay(r.n):r.v==='letters'?vLetters():r.v==='practice'?vPractice():vRead();
  const cur=r.v==='day'?'plan':r.v;
  document.getElementById('nav').innerHTML=NAV.map(([k,ta,en])=>`<a href="#${k}" ${k===cur?'aria-current="page"':''}>${ta}<small>${en}</small></a>`).join('');
  document.title='Angilam Padippom';
}
function rerender(){const y=window.scrollY;render();window.scrollTo(0,y)}
window.addEventListener('hashchange',()=>{shuffleSeed=false;if(route().v!=='practice')Q=null;render();window.scrollTo(0,0)});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-say],[data-act]');if(!el)return;
  if(el.dataset.say){
    say(el.dataset.say);
    if(el.dataset.rep){const k=el.dataset.rep;reps[k]=Math.min(5,(reps[k]||0)+1);el.closest('.w').querySelectorAll('.dots i').forEach((d,i)=>d.classList.toggle('f',i<reps[k]))}
    return;
  }
  const a=el.dataset.act,r=route(),n=r.n;
  if(a==='task'){const k=el.dataset.k;S.tasks[k]=!S.tasks[k];save();rerender()}
  else if(a==='complete'){if(S.done[n])delete S.done[n];else{S.done[n]=todayStr();toast('வாழ்த்துகள்! Day '+n+' முடிந்தது')}save();rerender()}
  else if(a==='rate'){S.rating[n]=+el.dataset.v;save();rerender()}
  else if(a==='shuffle'){shuffleSeed=true;rerender()}
  else if(a==='cnt'){S.counter[n]=Math.max(0,(S.counter[n]||0)+ +el.dataset.v);save();rerender()}
  else if(a==='reveal'){el.hidden=true;el.nextElementSibling.hidden=false}
  else if(a==='apple'){const h=document.getElementById('hero');h.classList.add('play');say('apple');setTimeout(()=>h.classList.remove('play'),2200)}
  else if(a==='timer'){
    const b=document.getElementById('tbtn'),tm=document.getElementById('tm');
    if(timer){clearInterval(timer);timer=null;const s=parseFloat(tm.textContent);b.textContent='மீண்டும் தொடங்கு';
      if(s>0&&(!S.speed[n]||s<S.speed[n])){S.speed[n]=s;save();toast('புதிய சிறந்த நேரம்: '+s+' வினாடி')}}
    else{const t0=performance.now();b.textContent='நிறுத்து';timer=setInterval(()=>{tm.textContent=((performance.now()-t0)/1000).toFixed(1)+'s'},100)}
  }
  else if(a==='pool'){qopt.pool=el.dataset.v;rerender()}
  else if(a==='quiz'){startQuiz(el.dataset.v);rerender();if(Q.mode==='listen')say(Q.items[0].w.en)}
  else if(a==='pick'){const it=Q.items[Q.i];Q.picked=+el.dataset.v;if(Q.picked===it.ans)Q.score++;rerender()}
  else if(a==='qnext'){Q.i++;Q.picked=null;if(Q.i>=10){if(Q.score>(S.best[Q.mode]||0)){S.best[Q.mode]=Q.score;save()}}rerender();if(Q.i<10&&Q.mode==='listen')say(Q.items[Q.i].w.en)}
  else if(a==='qexit'){Q=null;rerender()}
});
const slowBtn=document.getElementById('slow');
slowBtn.setAttribute('aria-pressed',!!S.slow);
slowBtn.addEventListener('click',()=>{S.slow=!S.slow;save();slowBtn.setAttribute('aria-pressed',!!S.slow);toast(S.slow?'மெதுவான ஒலி இயக்கப்பட்டது':'சாதாரண வேகம்')});
render();
</script>
